<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF007F;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF007F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#007AFF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bookGradient)" opacity="0.1"/>
  
  <!-- Main book -->
  <rect x="60" y="50" width="80" height="100" rx="8" fill="url(#bookGradient)" stroke="none"/>
  
  <!-- Book spine -->
  <rect x="60" y="50" width="12" height="100" rx="8" fill="url(#accentGradient)"/>
  
  <!-- Book pages -->
  <rect x="75" y="50" width="2" height="100" fill="white" opacity="0.3"/>
  <rect x="80" y="50" width="2" height="100" fill="white" opacity="0.3"/>
  <rect x="85" y="50" width="2" height="100" fill="white" opacity="0.3"/>
  
  <!-- Bitcoin symbol on cover -->
  <text x="100" y="105" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="white">₿</text>
  
  <!-- Sparkle effects -->
  <circle cx="45" cy="70" r="3" fill="#FF007F" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="80" r="2" fill="#007AFF" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="130" r="2.5" fill="#FF007F" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="125" r="3" fill="#007AFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>